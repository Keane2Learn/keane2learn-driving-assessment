<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Keane2Learn Driving Assessment</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="K2L Assessment" />
<meta name="theme-color" content="#232a63" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --pdt-navy: #232a63;
    --pdt-navy-dark: #161b42;
    --pdt-blue-pale: #eef0fa;
    --pdt-gold: #c9962f;
    --ink: #1a1d29;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f2f3f7;
    --green: #1a7a3c;
    --amber: #b8860b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent;
  }
  .brand-strip {
    max-width: 560px; margin: 0 auto; padding: 14px 16px 10px; display: flex;
    align-items: center; gap: 10px;
  }
  .brand-strip .brand-badge {
    background: var(--pdt-navy); color: #fff; font-weight: 800; font-size: 12px;
    padding: 6px 9px; border-radius: 8px; letter-spacing: 0.3px;
  }
  .brand-strip .brand-name { font-size: 14px; font-weight: 800; color: var(--pdt-navy); letter-spacing: 0.2px; }
  .brand-strip .brand-tagline { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  .hero-wordmark {
    font-size: 26px; font-weight: 800; color: var(--pdt-navy); letter-spacing: 0.3px; margin-bottom: 2px;
  }
  .hero-tagline {
    font-size: 12.5px; color: var(--pdt-gold); font-weight: 700; letter-spacing: 0.6px;
    margin: 0 0 14px; text-transform: uppercase;
  }
  .progress-wrap { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--pdt-navy); transition: width .25s ease; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px 18px 22px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(23,27,66,0.06); border: 1px solid var(--border);
  }
  h1 { font-size: 23px; margin: 0 0 8px; color: var(--pdt-navy); letter-spacing: -0.2px; }
  h2 { font-size: 17px; margin: 0 0 12px; color: var(--pdt-navy); }
  .subtitle { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 0 0 6px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .tag {
    font-size: 11px; font-weight: 600; color: var(--muted); background: var(--bg);
    padding: 2px 8px; border-radius: 20px; margin-left: 6px; vertical-align: middle;
  }
  .f-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin: 14px 0 6px; }
  .f-label:first-child { margin-top: 0; }
  .f-input {
    width: 100%; padding: 11px 12px; font-size: 16px; border: 1.5px solid var(--border);
    border-radius: 10px; background: #fafafa; color: var(--ink); font-family: inherit;
  }
  .f-input:focus { outline: none; border-color: var(--pdt-navy); background: #fff; }
  .f-textarea { resize: vertical; min-height: 44px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .yn-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .yn-row:last-child { border-bottom: none; }
  .yn-buttons { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-chip {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink);
  }
  .chip-active { background: var(--pdt-navy); border-color: var(--pdt-navy); color: #fff; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .score-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .score-item:last-child { border-bottom: none; }
  .score-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .grade-row { display: flex; gap: 8px; margin-top: 8px; }
  .grade-btn {
    flex: 1; padding: 12px 0; border-radius: 10px; border: 1.5px solid var(--border);
    background: #fff; font-size: 16px; font-weight: 700; color: var(--muted);
  }
  .grade-active.grade-1 { background: #7a1a1a; border-color: #7a1a1a; color: #fff; }
  .grade-active.grade-2 { background: #b8860b; border-color: #b8860b; color: #fff; }
  .grade-active.grade-3 { background: #1a5aab; border-color: #1a5aab; color: #fff; }
  .grade-active.grade-4 { background: var(--green); border-color: var(--green); color: #fff; }
  .rate-btn {
    flex: 1; padding: 12px 0; border-radius: 10px; border: 1.5px solid var(--border);
    background: #fff; font-size: 15px; font-weight: 700; color: var(--muted);
  }
  .rate-active { background: var(--pdt-navy); border-color: var(--pdt-navy); color: #fff; }
  .score-summary { display: flex; align-items: center; gap: 14px; margin: 6px 0 10px; }
  .score-big { font-size: 34px; font-weight: 800; }
  .score-of { font-size: 15px; color: var(--muted); margin-left: 2px; }
  .band-pill { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: #fff; }
  .band-NeedsDevelopment { background: #a33a3a; }
  .band-Developing { background: #b8860b; }
  .band-Competent { background: #2c5aa0; }
  .band-Advanced { background: #1a7a3c; }
  .nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .btn-primary {
    background: var(--pdt-navy); color: #fff; border: none; padding: 14px 22px;
    border-radius: 12px; font-size: 15.5px; font-weight: 700; margin-left: auto; display: block;
    box-shadow: 0 3px 10px rgba(35,42,99,0.25);
  }
  .btn-secondary {
    background: #fff; color: var(--ink); border: 1.5px solid var(--border); padding: 14px 22px;
    border-radius: 12px; font-size: 15.5px; font-weight: 700;
  }
  .btn-full { width: 100%; margin-bottom: 10px; }
  button { cursor: pointer; font-family: inherit; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; }

  .top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topbar-btn {
    background: var(--pdt-blue-pale); color: var(--pdt-navy); border: 1.5px solid var(--pdt-navy);
    font-weight: 700; font-size: 13.5px; padding: 8px 14px; border-radius: 20px;
  }
  .topbar-btn:active { background: var(--pdt-navy); color: #fff; }
  .link-btn { background: none; border: none; color: var(--pdt-navy-dark); font-weight: 700; font-size: 14px; padding: 6px 2px; text-decoration: underline; }
  .link-btn.danger { color: #9a2323; }
  .save-indicator {
    font-size: 12px; color: var(--muted); font-weight: 600; opacity: 0.85; transition: opacity .3s, color .3s;
    margin-left: auto;
  }
  .save-indicator.save-flash { color: var(--green); opacity: 1; }
  .save-indicator.save-error { color: #b3261e !important; opacity: 1; }
  .note.warn { color: #9a5a00; background: #fff6e6; border: 1px solid #f0d9a8; padding: 8px 10px; border-radius: 8px; }

  .session-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .session-row:last-child { border-bottom: none; }
  .session-name { font-weight: 700; font-size: 14.5px; }
  .session-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .session-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .sig-block { margin-bottom: 18px; }
  .sig-block:last-child { margin-bottom: 0; }
  .sig-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sig-canvas {
    width: 100%; height: 150px; border: 1.5px dashed var(--border); border-radius: 10px;
    background: #fafafa; touch-action: none; display: block;
  }
  .summary-bar {
    font-size: 12.5px; color: var(--muted); font-weight: 600; margin: -6px 0 12px;
    padding: 6px 12px; background: #eef0f3; border-radius: 8px; text-align: center;
  }
  .hub-tile {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .hub-tile:last-child { border-bottom: none; }
  .hub-tile:active { background: var(--bg); }
  .hub-tile-title { font-size: 15px; font-weight: 700; }
  .hub-tile-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .hub-arrow { font-size: 20px; color: var(--muted); flex-shrink: 0; }
</style>
</head>

<script>
/* ============================================================
   Keane2Learn Driving Assessment — core logic
   ============================================================ */

const { PDFDocument, rgb, StandardFonts } = PDFLib;

function wrapText(text, font, size, maxWidth) {
  if (!text) return [];
  const words = String(text).trim().split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (font.widthOfTextAtSize(test, size) > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawWrapped(page, text, x, yTop, size, font, maxWidth, maxLines, lineGap) {
  const lines = wrapText(text, font, size, maxWidth).slice(0, maxLines || 99);
  let y = yTop;
  for (const l of lines) {
    page.drawText(l, { x, y, size, font, color: rgb(0.05, 0.05, 0.15) });
    y -= (lineGap || (size + 2));
  }
  return y;
}

function dataUrlToBytes(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function drawSignature(doc, page, dataUrl, x, y, width, height) {
  if (!dataUrl) return;
  const bytes = dataUrlToBytes(dataUrl);
  const img = await doc.embedPng(bytes);
  const dims = img.scaleToFit(width, height);
  page.drawImage(img, { x, y, width: dims.width, height: dims.height });
}

function todayStr() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}/${mm}/${yy}`;
}

/* Manifest is injected as window.K2L_MANIFEST (see shell.html) */
const M = window.K2L_MANIFEST;

const SCORE_KEYS = [
  'pre_walkaround','pre_cockpit','pre_dashboard','pre_load',
  'speed_legal','speed_conditions','positioning_approach','lane_discipline',
  'hazard_id','anticipation','vru_awareness','site_hazards',
  'following_distance','space_obstructions','all_round_obs',
  'low_speed_control','reversing_parking','vehicle_control',
  'signal_timing','response_others','horn_lights',
  'signs_compliance','professional_conduct','post_drive_handover',
];
const SCORED_ONLY_KEYS = SCORE_KEYS.filter(k => !k.startsWith('pre_'));

async function loadTemplate(b64) {
  return PDFDocument.load(b64);
}

async function generateAssessmentPdf(data) {
  const doc = await loadTemplate(window.K2L_ASSESS_B64);
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const pages = doc.getPages();
  const F = M.assessment.fields;

  function textField(key, value, size) {
    const f = F[key];
    if (!f || !value) return;
    pages[f.page].drawText(String(value), { x: f.x, y: f.y, size: size || 9, font });
  }

  textField('delegateName', data.delegateName);
  textField('date', data.date);
  textField('location', data.location);
  textField('trainerName', data.trainerName);
  textField('courseName', data.courseName);
  textField('employer', data.employer);
  textField('vehicleReg', data.vehicleReg, 8.5);
  textField('vehicleMakeModel', data.vehicleMakeModel, 8.5);
  textField('odoOpening', data.odoOpening, 8.5);
  textField('odoClosing', data.odoClosing, 8.5);

  let total = 0;
  let hasLow = false;
  for (const key of SCORE_KEYS) {
    const f = F[key];
    if (!f) continue;
    const entry = (data.scores && data.scores[key]) || {};
    const page = pages[f.page];
    if (entry.comment) {
      drawWrapped(page, entry.comment, f.commentX, f.commentY, 6.8, font, f.commentWidth, 2, 7.2);
    }
    if (entry.grade && !key.startsWith('pre_')) {
      page.drawText(String(entry.grade), { x: f.scoreX - 2, y: f.scoreY, size: 9.5, font: bold });
      total += Number(entry.grade);
      if (Number(entry.grade) === 1) hasLow = true;
    } else if (entry.grade) {
      page.drawText(String(entry.grade), { x: f.scoreX - 2, y: f.scoreY, size: 9.5, font: bold });
    }
  }

  const tsField = F.totalScore;
  pages[tsField.page].drawText(String(total), { x: tsField.x, y: tsField.y, size: 11, font: bold });

  const band = M.assessment.scoreBands.find(b => total >= b.min && total <= b.max) || M.assessment.scoreBands[0];
  const bandPage = pages[tsField.page];
  bandPage.drawRectangle({
    x: band.x, y: band.y, width: band.w, height: band.h,
    borderColor: rgb(0.75, 0, 0), borderWidth: 1.6,
  });

  const tc = F.trainerComments;
  drawWrapped(pages[tc.page], data.trainerComments || '', tc.x, tc.yTop, 9, font, tc.width, 6, 11.5);

  const ds = F.delegateSignature;
  const ts = F.trainerSignature;
  await drawSignature(doc, pages[ds.page], data.delegateSignatureDataUrl, ds.x, ds.y, ds.width, ds.height);
  await drawSignature(doc, pages[ts.page], data.trainerSignatureDataUrl, ts.x, ts.y, ts.width, ts.height);

  return doc.save();
}

async function generateLicencePdf(data) {
  const doc = await loadTemplate(window.K2L_LICENCE_B64);
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const page = doc.getPages()[0];
  const F = M.licence.fields;
  const circleColor = rgb(0.75, 0, 0);

  function textField(key, value, size) {
    const f = F[key];
    if (!f || !value) return;
    page.drawText(String(value), { x: f.x, y: f.y, size: size || 9, font });
  }

  textField('delegateName', data.delegateName);
  textField('employer', data.employer);
  textField('location', data.location);
  textField('employeeNo', data.employeeNo);
  textField('managerName', data.managerName);
  textField('date', data.date);
  textField('licenceNumber', data.licenceNumber, 8);
  textField('licenceValidTo', data.licenceValidTo);
  textField('issueNumber', data.issueNumber);
  textField('driverCardNumber', data.driverCardNumber, 8);

  function circleYesNo(key, value) {
    const f = F[key];
    if (!f || !value) return;
    const x = value === 'yes' ? f.yesX : f.noX;
    page.drawEllipse({ x, y: f.y + 3, xScale: 14, yScale: 8, borderColor: circleColor, borderWidth: 1.3 });
  }
  circleYesNo('originalLicencePresented', data.originalLicencePresented);
  circleYesNo('fullValidLicence', data.fullValidLicence);
  circleYesNo('hasCpc', data.hasCpc);
  circleYesNo('hasTacho', data.hasTacho);

  if (data.vocationalCats && data.vocationalCats.length) {
    for (const cat of data.vocationalCats) {
      const box = M.licence.vocationalCats[cat];
      if (box) {
        page.drawEllipse({ x: box.x + box.w/2, y: box.y + box.h/2, xScale: box.w/2 + 3, yScale: box.h/2 + 2, borderColor: circleColor, borderWidth: 1.3 });
      }
    }
  }

  const end = F.endorsements;
  drawWrapped(page, data.endorsements || '', end.x, end.yTop, 8.5, font, end.width, 5, 10.5);
  const com = F.comments;
  drawWrapped(page, data.licenceComments || '', com.x, com.yTop, 8.5, font, com.width, 6, 10.5);

  return doc.save();
}

async function generateFeedbackPdf(data) {
  const doc = await loadTemplate(window.K2L_FEEDBACK_B64);
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const page = doc.getPages()[0];
  const F = M.feedback.fields;
  const circleColor = rgb(0.75, 0, 0);

  function textField(key, value, size) {
    const f = F[key];
    if (!f || !value) return;
    page.drawText(String(value), { x: f.x, y: f.y, size: size || 9, font });
  }
  textField('delegateName', data.delegateName);
  textField('courseName', data.courseName);
  textField('date', data.date);
  textField('trainerName', data.trainerName);

  const ratings = data.feedbackRatings || {};
  for (const key of ['venue','clarity','practical_value','professionalism','knowledge','overall']) {
    const f = F[key];
    const val = ratings[key];
    if (f && val) {
      const cx = f.positions[String(val)];
      page.drawEllipse({ x: cx, y: f.y + 3, xScale: 9, yScale: 8, borderColor: circleColor, borderWidth: 1.3 });
    }
  }

  const tp = F.threePoints;
  drawWrapped(page, data.threePoints || '', tp.x, tp.yTop, 9, font, tp.width, 4, 11.5);
  const com = F.comments;
  drawWrapped(page, data.feedbackComments || '', com.x, com.yTop, 9, font, com.width, 6, 11.5);

  textField('sessionTimes', data.sessionTimes, 8.5);

  const ds = F.delegateSignature;
  await drawSignature(doc, page, data.delegateSignatureDataUrl, ds.x, ds.y, ds.width, ds.height);

  return doc.save();
}

function downloadBytes(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

window.K2L = {
  generateAssessmentPdf, generateLicencePdf, generateFeedbackPdf, downloadBytes, todayStr,
  SCORE_KEYS, SCORED_ONLY_KEYS,
};

</script>

  };
}

async function authFetch(url, options) {
  options = options || {};
  const mergedHeaders = { ...authHeaders(), ...(options.headers || {}) };
  let res = await fetch(url, { ...options, headers: mergedHeaders });
  if (res.status === 401 && auth.refreshToken) {
    const refreshed = await Auth.refresh();
    if (refreshed) {
      const retryHeaders = { ...authHeaders(), ...(options.headers || {}) };
      res = await fetch(url, { ...options, headers: retryHeaders });
    }
  }
  return res;
}

const Auth = {
  async signup(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.msg || body.error_description || 'Sign up failed');
    return body;
  },
  async login(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.msg || body.error_description || 'Login failed');
    auth = { accessToken: body.access_token, refreshToken: body.refresh_token, userId: body.user.id, email: body.user.email };
    saveAuthToStorage();
    return body;
  },
  async refresh() {
    if (!auth.refreshToken) return false;
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: auth.refreshToken }),
      });
      const body = await res.json();
      if (!res.ok) return false;
      auth = { accessToken: body.access_token, refreshToken: body.refresh_token, userId: body.user.id, email: body.user.email };
      saveAuthToStorage();
      return true;
    } catch (e) { return false; }
  },
  logout() {
    auth = { accessToken: null, refreshToken: null, userId: null, email: null };
    org = { id: null, name: null, logo: null };
    clearAuthStorage();
  },
  async getMyOrg() {
    if (!auth.accessToken) throw new Error('Not logged in — please log in again.');

  },
  async createOrg(name) {
    if (!auth.accessToken) throw new Error('Not logged in — please log in again.');
    const res = await authFetch(`${SUPABASE_URL}/rest/v1/k2l_organizations`, {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify([{ name }]),
    });
    const rows = await res.json();
    if (!res.ok) throw new Error(rows?.message ? `Could not create organization (${rows.message})` : 'Could not create organization — try logging out and back in.');
    const newOrg = rows[0];
    const memRes = await authFetch(`${SUPABASE_URL}/rest/v1/k2l_org_members`, {
      method: 'POST',
      body: JSON.stringify([{ org_id: newOrg.id, user_id: auth.userId, role: 'owner' }]),
    });
    if (!memRes.ok) throw new Error('Could not link organization membership');
    org = { id: newOrg.id, name: newOrg.name, logo: newOrg.logo_data_url, planStatus: newOrg.plan_status };
    saveAuthToStorage();
    return org;
  },
  async updateOrg(fields) {

    const res = await authFetch(`${SUPABASE_URL}/rest/v1/k2l_organizations?id=eq.${org.id}`, {
      method: 'PATCH',

      body: JSON.stringify(fields),

    if (!res.ok) throw new Error('Could not update organization');
    org = { id: rows[0].id, name: rows[0].name, logo: rows[0].logo_data_url, planStatus: rows[0].plan_status };
    saveAuthToStorage();

}

    buttons += `<button class="rate-btn ${val===r?'rate-active':''}" data-rate="${key}:${r}">${r}</button>`;
  }
  return `<div class="score-item">
    <div class="score-label">${label}</div>
    <div class="grade-row">${buttons}</div>
  </div>`;
}

function computeTotals() {
  let total = 0, hasLow = false, filled = 0;
  for (const key of window.K2L.SCORED_ONLY_KEYS) {
    const e = data.scores[key];
    if (e && e.grade) {
      total += Number(e.grade);
      filled++;
      if (Number(e.grade) === 1) hasLow = true;
    }
  }
  const n = window.K2L.SCORED_ONLY_KEYS.length;
  let band = 'Needs Development';
  if (total >= n*3+1) band = 'Advanced';
  else if (total >= Math.ceil(n*2.5)) band = 'Competent';
  else if (total >= n*2) band = 'Developing';
  return { total, band, filled, max: n * 4, count: n };
}

function timeAgo(ts) {

function sigPadBlock(title, key) {
  return `
    <div class="sig-block">
      <div class="sig-header">
        <span class="f-label" style="margin:0">${title}</span>
        <button class="link-btn" data-sig-clear="${key}">Clear</button>
      </div>
      <canvas class="sig-canvas" id="canvas_${key}" data-sig-canvas="${key}"></canvas>
    </div>`;
}

function setupSignaturePad(key) {
  const canvas = document.getElementById('canvas_' + key);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a1d29';

  const existing = data[key + 'SignatureDataUrl'];
  if (existing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = existing;
  }

  let drawing = false;
  let last = null;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx, y: cy };
  }
  function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end() {
    if (!drawing) return;
    drawing = false;
    data[key + 'SignatureDataUrl'] = canvas.toDataURL('image/png');
    scheduleSave();
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function clearSignature(key) {
  const canvas = document.getElementById('canvas_' + key);
  if (canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); }
  data[key + 'SignatureDataUrl'] = null;
  scheduleSave();
}

        <h2>Driving Assessment</h2>
        ${Object.entries(SEC_LABELS).map(([k, sec]) => `
          <div class="hub-tile" data-hub-go="${k}"><div><div class="hub-tile-title">${sec.title}</div><div class="hub-tile-sub">${sectionProgress(k)}</div></div><div class="hub-arrow">›</div></div>
        `).join('')}
        <div class="hub-tile" data-hub-go="trainerComments"><div><div class="hub-tile-title">Total Score & Comments</div></div><div class="hub-arrow">›</div></div>
      </div>
    `;
  }
  app.innerHTML = inner;
  document.querySelectorAll('[data-hub-go]').forEach(el => el.addEventListener('click', e => goToStep(e.currentTarget.dataset.hubGo)));
  document.querySelectorAll('[data-hub-open]').forEach(el => el.addEventListener('click', e => { hubForm = e.currentTarget.dataset.hubOpen; renderHub(); }));
  const closeBtn = document.getElementById('btnCloseHub'); if (closeBtn) closeBtn.addEventListener('click', closeHub);
  const backBtn = document.getElementById('btnHubBack'); if (backBtn) backBtn.addEventListener('click', () => { hubForm = null; renderHub(); });
}

/* ------------------------------------------------------------
   Render
   ------------------------------------------------------------ */

function render() {
  if (hubOpen) { renderHub(); return; }
  const stripEl = document.getElementById('brandStrip');
  if (stripEl) stripEl.style.display = (step === 0) ? 'none' : 'flex';
  const app = document.getElementById('app');
  const s = STEPS[step];
  let html = '';

  if (s === 'home') {
    if (!auth.accessToken) {
      html = renderAuthScreen();
    } else if (!org.id) {
      html = renderOnboardingScreen();
    } else if (org.planStatus !== 'active') {
      html = renderSubscribeScreen();
    } else {
    if (cachedSessions === null && !sessionsLoading) {
      sessionsLoading = true;
      RemoteStore.listSessions().then(rows => {
        cachedSessions = rows || [];
        sessionsLoading = false;
        if (step === 0) render();
      });
    }
    const sessions = (cachedSessions || []).slice().sort((a, b) => b.updatedAt - a.updatedAt);
    html = `
      <div class="card">
        <div class="hero-wordmark">KEANE2LEARN</div>
        <div class="hero-tagline">DRIVING ASSESSMENT</div>
        <h1>${escapeHtml(org.name || 'Session Forms')}</h1>
        <p class="subtitle">Complete the Driving Assessment Report, Licence & Compliance Record, and Delegate Feedback Form on your phone, then export completed PDFs.</p>
        <p class="note">Signed in as ${escapeHtml(auth.email)} · <button class="link-btn" id="btnLogout" style="padding:0;font-size:12.5px;">Log out</button></p>
        <button class="btn-primary btn-full" id="btnNewSession">+ Start new session</button>
        <button class="btn-secondary btn-full" id="btnAccountSettings">Account & branding</button>
      </div>
      <div class="card">
        <h2>Saved sessions</h2>
        <p class="note" id="homeLoading">${sessionsLoading ? 'Loading…' : (cachedSessions === null ? '' : (RemoteStore.available ? '' : 'Could not connect — check your internet connection and reopen.'))}</p>
        ${sessions.length ? sessions.map(sess => `
          <div class="session-row">
            <div class="session-info">
              <div class="session-name">${escapeHtml(sess.delegateName)}</div>
              <div class="session-meta">${escapeHtml(sess.courseName||'')} · updated ${timeAgo(sess.updatedAt)}</div>
            </div>
            <div class="session-actions">
              <button class="btn-chip" data-resume="${sess.id}">Resume</button>
              <button class="link-btn danger" data-delete="${sess.id}">Delete</button>
            </div>
          </div>
        `).join('') : (sessionsLoading ? '' : '<p class="note">No saved sessions yet.</p>')}
      </div>
    `;
    }
  } else if (s === 'session') {
    html = `
      <div class="card">
        <h2>Session Details</h2>
        <p class="note">Fill these in once — used automatically across all 3 forms.</p>
        ${fieldRow('Delegate Name', 'delegateName')}
        ${fieldRow('Date', 'date')}
        ${fieldRow('Location', 'location')}
        ${fieldRow('Trainer Name', 'trainerName')}
        ${fieldRow('Course / Session Type', 'courseName')}
        ${fieldRow('Employer / Company', 'employer')}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'vehicle') {
    html = `
      <div class="card">
        <h2>Vehicle Information</h2>
        ${fieldRow('Registration', 'vehicleReg')}
        ${fieldRow('Make & Model', 'vehicleMakeModel')}
        <div class="two-col">
          ${fieldRow('Odometer (Start)', 'odoOpening')}
          ${fieldRow('Odometer (End)', 'odoClosing')}
        </div>
      </div>
      <div class="card">
        <h2>Pre-Drive Checks <span class="tag">not scored</span></h2>
        ${Object.entries(PREDRIVE_LABELS).map(([k,label]) => `
          <label class="f-label">${label}</label>
          <textarea class="f-input f-textarea" rows="2" data-score-comment="${k}">${escapeHtml((data.scores[k]&&data.scores[k].comment)||'')}</textarea>
        `).join('')}
      </div>
      ${navButtons()}
    `;
  } else if (s.startsWith('sec_')) {
    const sec = SEC_LABELS[s];
    html = `
      <div class="card">
        <h2>${sec.title}</h2>
        <p class="note">Grade 1 (needs development) – 4 (advanced) for each area. See the Scoring Guide for definitions.</p>
        ${Object.entries(sec.items).map(([k,label]) => scoreItem(k, label)).join('')}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'licence') {
    html = `
      <div class="card">
        <h2>Licence & Compliance Record</h2>
        ${yesNoToggle('Original licence presented?', 'originalLicencePresented')}
        ${yesNoToggle('Full valid licence for category used?', 'fullValidLicence')}
        ${fieldRow('Licence Number', 'licenceNumber')}
        <div class="two-col">
          ${fieldRow('Valid To', 'licenceValidTo', {placeholder:'DD/MM/YYYY'})}
          ${fieldRow('Issue Number', 'issueNumber')}
        </div>
        ${fieldRow('Endorsements / codes relevant to this course', 'endorsements', {type:'textarea', rows:2})}
        <label class="f-label">Vocational categories held</label>
        <div class="chip-wrap">
          ${VOCATIONAL_CATS.map(c => `<button class="btn-chip ${data.vocationalCats.includes(c)?'chip-active':''}" data-voc="${c}">${c}</button>`).join('')}
        </div>
        ${yesNoToggle('Holds valid CPC qualification card?', 'hasCpc')}
        ${yesNoToggle('Holds valid digital tachograph card?', 'hasTacho')}
        ${fieldRow('Driver Card Number', 'driverCardNumber')}
        ${fieldRow('Comments', 'licenceComments', {type:'textarea', rows:2})}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'trainerComments') {
    const t = computeTotals();
    html = `
      <div class="card">
        <h2>Total Score & Trainer Comments</h2>
        <div class="score-summary">
          <div><span class="score-big">${t.total}</span><span class="score-of">/${t.max}</span></div>
          <div class="band-pill band-${t.band.replace(' ','')}">${t.band}</div>
        </div>
        <p class="note">${t.filled}/${t.count} areas graded so far.</p>
        ${fieldRow('Trainer comments (overview of the session)', 'trainerComments', {type:'textarea', rows:6})}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'feedback') {
    html = `
      <div class="card">
        <h2>Delegate Feedback</h2>
        <p class="note">Rate 1 (needs improvement) – 5 (excellent).</p>
        ${Object.entries(RATING_LABELS).map(([k,label]) => ratingItem(k, label)).join('')}
        ${fieldRow('Three things to keep working on', 'threePoints', {type:'textarea', rows:3})}
        ${fieldRow('Additional comments', 'feedbackComments', {type:'textarea', rows:3})}
        ${fieldRow('Session start / finish time', 'sessionTimes', {placeholder:'09:00 - 16:30'})}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'signatures') {
    html = `
      <div class="card">
        <h2>Signatures</h2>
        <p class="note">Sign with your finger or a stylus.</p>
        ${sigPadBlock('Delegate signature', 'delegate')}
        ${sigPadBlock('Trainer signature', 'trainer')}
      </div>
      ${navButtons()}
    `;
  } else if (s === 'review') {
    const t = computeTotals();
    html = `
      <div class="card">
        <h2>Review & Export</h2>
        <p><strong>${escapeHtml(data.delegateName||'Delegate')}</strong> — ${escapeHtml(data.courseName||'')}<br/>
        ${escapeHtml(data.date||'')} · ${escapeHtml(data.location||'')} · Trainer: ${escapeHtml(data.trainerName||'')}</p>
        <div class="score-summary">
          <div><span class="score-big">${t.total}</span><span class="score-of">/${t.max}</span></div>
          <div class="band-pill band-${t.band.replace(' ','')}">${t.band}</div>
        </div>
        <button class="btn-primary btn-full" id="dlAssess">Download Driving Assessment Report</button>
        <button class="btn-primary btn-full" id="dlLicence">Download Licence & Compliance Record</button>
        <button class="btn-primary btn-full" id="dlFeedback">Download Delegate Feedback Form</button>
      </div>
      <div class="card">
        <button class="btn-secondary btn-full" id="btnRestart">Finish & return to sessions</button>
      </div>
      ${navButtons({ hideNext: true })}
    `;
  } else if (s === 'account') {
    html = `
      <div class="card">
        <h2>Account & Branding</h2>
        <p class="note">Signed in as ${escapeHtml(auth.email)}</p>
        <label class="f-label">Company / trading name</label>
        <input class="f-input" type="text" id="orgNameInput" value="${escapeHtml(org.name || '')}" />
        <label class="f-label">Logo</label>
        <input type="file" accept="image/*" id="orgLogoInput" />
        ${org.logo ? `<img src="${org.logo}" style="max-height:48px;margin-top:10px;display:block;" />` : '<p class="note">No logo uploaded yet.</p>'}
        <button class="btn-primary btn-full" id="btnSaveOrg" style="margin-top:16px;">Save changes</button>
      </div>
      <div class="card">
        <button class="btn-secondary btn-full" id="btnBackToHome">← Back to sessions</button>
      </div>
    `;
  }

  app.innerHTML = `${topBar()}${sharedSummaryBar()}${progressBar()}${html}`;
  attachHandlers();
  if (s === 'signatures') { setupSignaturePad('delegate'); setupSignaturePad('trainer'); }
}

function attachHandlers() {
  // Auth screen handlers
  const btnAuthSubmit = document.getElementById('btnAuthSubmit');
  if (btnAuthSubmit) btnAuthSubmit.addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) { authError = 'Enter both email and password.'; render(); return; }
    authBusy = true; authError = null; render();
    try {
      if (authMode === 'signup') {
        await Auth.signup(email, password);
        signupJustSent = true;
        authMode = 'login';
      } else {
        await Auth.login(email, password);
        const myOrg = await Auth.getMyOrg();
        if (myOrg) { org = myOrg; saveAuthToStorage(); }
        signupJustSent = false;
      }
    } catch (e) {
      authError = e.message || 'Something went wrong.';
    }
    authBusy = false;
    render();
  });
  const btnAuthSwitch = document.getElementById('btnAuthSwitch');
  if (btnAuthSwitch) btnAuthSwitch.addEventListener('click', () => {
    authMode = authMode === 'login' ? 'signup' : 'login';
    authError = null; signupJustSent = false;
    render();
  });
  const btnCreateOrg = document.getElementById('btnCreateOrg');
  if (btnCreateOrg) btnCreateOrg.addEventListener('click', async () => {
    const name = document.getElementById('onboardingOrgName').value.trim();
    if (!name) { onboardingError = 'Enter a company name.'; render(); return; }
    onboardingBusy = true; onboardingError = null; render();
    try {
      await Auth.createOrg(name);
      cachedSessions = null;
    } catch (e) {
      onboardingError = e.message || 'Could not set up your organization.';
    }
    onboardingBusy = false;
    render();
  });
  const btnLogout = document.getElementById('btnLogout');
  if (btnLogout) btnLogout.addEventListener('click', () => {
    Auth.logout();
    cachedSessions = null; sessionId = null; data = {};
    render();
  });
  const btnAccountSettings = document.getElementById('btnAccountSettings');
  if (btnAccountSettings) btnAccountSettings.addEventListener('click', () => goToStep('account'));
  const btnSubscribe = document.getElementById('btnSubscribe');
  if (btnSubscribe) btnSubscribe.addEventListener('click', startCheckout);
  const btnRefreshStatus = document.getElementById('btnRefreshStatus');
  if (btnRefreshStatus) btnRefreshStatus.addEventListener('click', async () => {
    btnRefreshStatus.disabled = true; btnRefreshStatus.textContent = 'Checking…';
    await Auth.refreshOrgStatus();
    render();
  });
  const btnLogoutSub = document.getElementById('btnLogoutSub');
  if (btnLogoutSub) btnLogoutSub.addEventListener('click', () => { Auth.logout(); render(); });
  const btnBackToHome = document.getElementById('btnBackToHome');
  if (btnBackToHome) btnBackToHome.addEventListener('click', goHome);
  const btnSaveOrg = document.getElementById('btnSaveOrg');
  if (btnSaveOrg) btnSaveOrg.addEventListener('click', async () => {
    const name = document.getElementById('orgNameInput').value.trim();
    const fileInput = document.getElementById('orgLogoInput');
    const fields = { name };
    async function finishSave() {
      btnSaveOrg.disabled = true; btnSaveOrg.textContent = 'Saving…';
      try { await Auth.updateOrg(fields); render(); }
      catch (e) { alert('Could not save changes.'); }
    }
    if (fileInput && fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = () => { fields.logo_data_url = reader.result; finishSave(); };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      finishSave();
    }
  });

  document.querySelectorAll('[data-key]').forEach(el => el.addEventListener('input', e => { data[e.target.dataset.key] = e.target.value; scheduleSave(); }));
  document.querySelectorAll('[data-score-comment]').forEach(el => el.addEventListener('input', e => {
    const k = e.target.dataset.scoreComment;
    data.scores[k] = data.scores[k] || {};
    data.scores[k].comment = e.target.value;
    scheduleSave();
  }));
  document.querySelectorAll('[data-grade]').forEach(el => el.addEventListener('click', e => {
    const [k, g] = e.target.dataset.grade.split(':');
    data.scores[k] = data.scores[k] || {};
    data.scores[k].grade = data.scores[k].grade === Number(g) ? null : Number(g);
    persistNow(); render();
  }));
  document.querySelectorAll('[data-rate]').forEach(el => el.addEventListener('click', e => {
    const [k, r] = e.target.dataset.rate.split(':');
    data.feedbackRatings[k] = data.feedbackRatings[k] === Number(r) ? null : Number(r);
    persistNow(); render();
  }));
  document.querySelectorAll('[data-yn]').forEach(el => el.addEventListener('click', e => {
    const [k, v] = e.target.dataset.yn.split(':');
    data[k] = data[k] === v ? null : v;
    persistNow(); render();
  }));
  document.querySelectorAll('[data-voc]').forEach(el => el.addEventListener('click', e => {
    const c = e.target.dataset.voc;
    const idx = data.vocationalCats.indexOf(c);
    if (idx >= 0) data.vocationalCats.splice(idx, 1); else data.vocationalCats.push(c);
    persistNow(); render();
  }));
  document.querySelectorAll('[data-sig-clear]').forEach(el => el.addEventListener('click', e => clearSignature(e.target.dataset.sigClear)));
  document.querySelectorAll('[data-resume]').forEach(el => el.addEventListener('click', e => resumeSession(e.target.dataset.resume)));
  document.querySelectorAll('[data-delete]').forEach(el => el.addEventListener('click', e => deleteSession(e.target.dataset.delete)));

  const btnNewSession = document.getElementById('btnNewSession'); if (btnNewSession) btnNewSession.addEventListener('click', startNewSession);
  const btnHome = document.getElementById('btnHome'); if (btnHome) btnHome.addEventListener('click', goHome);
  const btnOpenHub = document.getElementById('btnOpenHub'); if (btnOpenHub) btnOpenHub.addEventListener('click', openHub);
  const back = document.getElementById('btnBack'); if (back) back.addEventListener('click', () => { step = Math.max(1, step - 1); persistNow(); render(); window.scrollTo(0,0); });
  const next = document.getElementById('btnNext'); if (next) next.addEventListener('click', () => { step = Math.min(STEPS.length - 1, step + 1); persistNow(); render(); window.scrollTo(0,0); });
  const restart = document.getElementById('btnRestart'); if (restart) restart.addEventListener('click', () => { persistNow(); step = 0; render(); window.scrollTo(0,0); });

  async function withBusy(btn, fn) {
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Generating…';
    try { await fn(); } catch (err) { console.error(err); alert('Something went wrong generating the PDF.'); }
    finally { btn.disabled = false; btn.textContent = orig; }
  }
  const dlAssess = document.getElementById('dlAssess');
  if (dlAssess) dlAssess.addEventListener('click', () => withBusy(dlAssess, async () => {
    const bytes = await window.K2L.generateAssessmentPdf(data);
    window.K2L.downloadBytes(bytes, `Driving_Assessment_${(data.delegateName||'delegate').replace(/\s+/g,'_')}.pdf`);
  }));
  const dlLicence = document.getElementById('dlLicence');
  if (dlLicence) dlLicence.addEventListener('click', () => withBusy(dlLicence, async () => {
    const bytes = await window.K2L.generateLicencePdf(data);
    window.K2L.downloadBytes(bytes, `Licence_Record_${(data.delegateName||'delegate').replace(/\s+/g,'_')}.pdf`);
  }));
  const dlFeedback = document.getElementById('dlFeedback');
  if (dlFeedback) dlFeedback.addEventListener('click', () => withBusy(dlFeedback, async () => {
    const bytes = await window.K2L.generateFeedbackPdf(data);
    window.K2L.downloadBytes(bytes, `Feedback_${(data.delegateName||'delegate').replace(/\s+/g,'_')}.pdf`);
  }));
}

loadAuthFromStorage();
render();

</script>
</body>
</html>
