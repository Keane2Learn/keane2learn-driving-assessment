<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driving Test Centre Guide</title>
<style>
  :root{
    --bg:#f5f6f3; --surface:#fff; --surface-2:#eef0ec; --ink:#14171c;
    --ink-muted:#565f68; --ink-faint:#8b929a; --accent:#0b5fa5; --accent-ink:#fff;
    --accent-soft:#e4eff8; --line:#dadfe0; --good:#1a7f4b; --bad:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151a; --surface:#1b1f26; --surface-2:#20252c; --ink:#e9ebee;
      --ink-muted:#a4acb5; --ink-faint:#6d7581; --accent:#5aa8e8; --accent-ink:#0b1420;
      --accent-soft:#1c2c3c; --line:#2b3038; --good:#5cc98a; --bad:#ff8a8a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
  header h1{margin:0;font-size:1.1rem}
  header p{margin:2px 0 0;color:var(--ink-muted);font-size:.85rem}
  main{max-width:720px;margin:0 auto;padding:16px 16px 64px}
  .searchbar{display:flex;gap:8px;margin:14px 0}
  input,select,textarea,button{font:inherit;color:inherit}
  input[type=text],select{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .card:hover{border-color:var(--accent)}
  .card-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .centre-name{font-weight:600}
  .centre-sub{color:var(--ink-muted);font-size:.85rem}
  .pill{font-size:.78rem;padding:3px 9px;border-radius:100px;white-space:nowrap;font-weight:600}
  .pill.rate-good{background:rgba(26,127,75,.12);color:var(--good)}
  .pill.rate-bad{background:rgba(179,38,30,.12);color:var(--bad)}
  .pill.rate-mid{background:var(--accent-soft);color:var(--accent)}
  .pill.none{background:var(--surface-2);color:var(--ink-faint)}
  .backlink{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none;cursor:pointer}
  h2{margin:0 0 2px}
  .muted{color:var(--ink-muted)}
  .section{margin:22px 0}
  .section h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin:0 0 10px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center}
  .stat-box .num{font-size:1.4rem;font-weight:700}
  .stat-box .lbl{color:var(--ink-muted);font-size:.78rem;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  table{border-collapse:collapse}
  table td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
  table td.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
  table tr:last-child td{border-bottom:none}
  .tag{background:var(--surface-2);border-radius:100px;padding:5px 12px;font-size:.82rem}
  .review{border-bottom:1px solid var(--line);padding:12px 0}
  .review:last-child{border-bottom:none}
  .review-head{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-muted);margin-bottom:4px}
  .stars{color:#e0a800}
  form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
  form label{display:block;font-size:.85rem;color:var(--ink-muted);margin:10px 0 4px}
  form label:first-child{margin-top:0}
  textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:80px}
  select{width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.primary{margin-top:14px;width:100%;padding:12px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.6;cursor:default}
  .hp{position:absolute;left:-9999px}
  .note{font-size:.78rem;color:var(--ink-faint);margin-top:8px}
  .empty{color:var(--ink-faint);padding:20px 0;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  a.src{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>🚗 Driving Test Centre Guide</h1>
  <p>Official DVSA pass rates, plus anonymous reviews from real candidates — no names, ever.</p>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------
   Config — fill these in from your Supabase project
   (Dashboard > Project Settings > API)
   ------------------------------------------------------------ */
const SUPABASE_URL = 'https://wqolxmezdudtqwvqilbf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oyl-uBQ5cqAIyoLc0J1A5A_qovyRDCw';

/* ------------------------------------------------------------
   National context — GB-wide DVSA figures (not tied to any one
   centre, so not worth a database table). Source: DRT121A, DRT121D,
   DRT121E, DRT111C, DRT121G — gov.uk/government/statistics/driving-test-statistics,
   Open Government Licence v3.0. Update by hand once a year when
   DVSA republishes; ask Claude to regenerate these numbers from the
   new files.
   ------------------------------------------------------------ */
const NATIONAL_STATS = {
  period: '2024-25',
  overallPassRate: 48.7,
  firstAttemptPassRate: 48.9,
  zeroFaultPassShare: 4.4, // % of passes that were fault-free
  theoryPassRate: 44.9,
  passByAttempt: [
    ['1st', 48.9], ['2nd', 49.5], ['3rd', 49.1], ['4th', 48.0], ['5th', 46.8], ['6th+', 42.5],
  ],
  waitTimesAsOf: 'July 2026',
  regionalWaitWeeks: [
    ['South West', 17.3], ['Yorkshire and the Humber', 17.6], ['Wales', 12.4],
    ['North East', 19.5], ['Scotland', 20.4], ['North West', 20.5],
    ['South East', 21.2], ['East Midlands', 21.3], ['West Midlands', 22.8],
    ['East of England', 23.2], ['London', 23.5],
  ].sort((a, b) => a[1] - b[1]),
};

/* ------------------------------------------------------------
   State
   ------------------------------------------------------------ */
let centres = [];
let passRates = {};   // centre_id -> [{period_label, tests_conducted, tests_passed, first_attempt_tests, first_attempt_passes}, ...]
let ageRates = {};    // centre_id -> { age: {tests_conducted, tests_passed} }
let reviews = {};     // centre_id -> [{rating, outcome, reviewer_role, comment, created_at}, ...]
let view = 'list';
let selectedId = null;
let search = '';
let regionFilter = '';
let ageFilter = '';   // '' = all ages, else '17'..'25'
let sortBy = 'pass_desc'; // pass_desc | pass_asc | first_time_desc | name_asc
let loaded = false;

/* ------------------------------------------------------------
   Supabase REST helpers
   ------------------------------------------------------------ */
function sbHeaders(extra) {
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  }, extra || {});
}

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbInsert(table, row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(await res.text());
}

async function loadAll() {
  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  if (!configured) { loaded = 'unconfigured'; render(); return; }
  try {
    const [c, p, r] = await Promise.all([
      sbGet('test_centres?select=id,name,town,county,region,postcode&order=name.asc'),
      sbGet('pass_rate_stats?select=centre_id,period_label,tests_conducted,tests_passed,first_attempt_tests,first_attempt_passes,automatic_tests,automatic_passes&order=period_label.desc'),
      sbGet('reviews?select=centre_id,rating,outcome,reviewer_role,comment,created_at&is_approved=eq.true&order=created_at.desc'),
    ]);
    centres = c;
    passRates = {}; p.forEach(row => (passRates[row.centre_id] = passRates[row.centre_id] || []).push(row));
    reviews = {}; r.forEach(row => (reviews[row.centre_id] = reviews[row.centre_id] || []).push(row));
    // Age breakdown is a newer, optional table — don't fail the whole app
    // if the migration for it hasn't been run yet.
    ageRates = {};
    try {
      const a = await sbGet('age_pass_rates?select=centre_id,age,tests_conducted,tests_passed');
      a.forEach(row => { (ageRates[row.centre_id] = ageRates[row.centre_id] || {})[row.age] = row; });
    } catch (e) { console.warn('age_pass_rates not available yet', e); }
    loaded = true;
  } catch (e) {
    console.error(e);
    loaded = 'error';
  }
  render();
}

/* ------------------------------------------------------------
   Derived data
   ------------------------------------------------------------ */
function latestPassRate(centreId) {
  const rows = passRates[centreId];
  if (!rows || !rows.length) return null;
  const r = rows[0];
  if (!r.tests_conducted) return null;
  return { pct: Math.round((r.tests_passed / r.tests_conducted) * 1000) / 10, period: r.period_label, conducted: r.tests_conducted, passed: r.tests_passed };
}

function firstTimePassRate(centreId) {
  const rows = passRates[centreId];
  if (!rows || !rows.length || !rows[0].first_attempt_tests) return null;
  const r = rows[0];
  return { pct: Math.round((r.first_attempt_passes / r.first_attempt_tests) * 1000) / 10, tests: r.first_attempt_tests };
}

function agePassRate(centreId, age) {
  const row = ageRates[centreId] && ageRates[centreId][age];
  if (!row || !row.tests_conducted) return null;
  return { pct: Math.round((row.tests_passed / row.tests_conducted) * 1000) / 10, tests: row.tests_conducted };
}

// The rate actually shown/sorted-on for a centre, honouring the age filter
// (falls back to the overall rate if that centre has no data for the
// selected age, so the list doesn't just drop it).
function effectivePassRate(centreId) {
  if (ageFilter) {
    const r = agePassRate(centreId, Number(ageFilter));
    if (r) return Object.assign({ isAgeSpecific: true }, r);
  }
  const r = latestPassRate(centreId);
  return r ? Object.assign({ isAgeSpecific: false }, r) : null;
}

function rateClass(pct) {
  if (pct == null) return 'none';
  if (pct >= 50) return 'rate-good';
  if (pct >= 38) return 'rate-mid';
  return 'rate-bad';
}

const KEYWORD_TAGS = [
  ['Friendly examiner', /friendly|kind|patient|put me at ease|nice examiner/i],
  ['Strict / formal', /strict|formal|no chat|serious/i],
  ['Chatty examiner', /chatty|talkative|small talk/i],
  ['Quiet test routes', /quiet road|calm route|not busy/i],
  ['Busy roads', /busy road|heavy traffic|congest/i],
  ['Lots of roundabouts', /roundabout/i],
  ['Dual carriageway / motorway', /dual carriageway|motorway/i],
  ['Tricky parking manoeuvre', /parking (was )?(hard|tricky|difficult)|bay park|parallel park/i],
  ['Limited parking at centre', /nowhere to park|hard(?:ly)? (?:any )?parking|parking (?:was )?(?:limited|full)/i],
  ['Long wait on the day', /long wait|waited ages|running late|delay/i],
  ['Independent driving / sat nav', /independent driving|sat ?nav/i],
];

function reviewSummary(centreId) {
  const rows = reviews[centreId] || [];
  if (!rows.length) return null;
  const ratings = rows.filter(r => r.rating).map(r => r.rating);
  const avg = ratings.length ? Math.round((ratings.reduce((a, b) => a + b, 0) / ratings.length) * 10) / 10 : null;
  const passes = rows.filter(r => r.outcome === 'pass').length;
  const fails = rows.filter(r => r.outcome === 'fail').length;
  const text = rows.map(r => r.comment || '').join(' \n ');
  const tags = KEYWORD_TAGS
    .map(([label, re]) => [label, (text.match(new RegExp(re, 'gi')) || []).length])
    .filter(([, n]) => n >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([label]) => label);
  return { count: rows.length, avg, passes, fails, tags };
}

/* ------------------------------------------------------------
   Rendering
   ------------------------------------------------------------ */
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeAgo(iso) {
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (d <= 0) return 'today'; if (d === 1) return '1 day ago'; if (d < 30) return d + ' days ago';
  const m = Math.floor(d / 30); return m === 1 ? '1 month ago' : m + ' months ago';
}

function render() {
  const app = document.getElementById('app');
  if (loaded === 'unconfigured') {
    app.innerHTML = `<div class="empty"><p><strong>Not connected yet.</strong></p>
      <p>Open <code>index.html</code> and set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>
      at the top of the script (from your Supabase project's API settings), then run <code>schema.sql</code>
      in the Supabase SQL editor.</p></div>`;
    return;
  }
  if (loaded === 'error') {
    app.innerHTML = `<div class="empty">Couldn't load data. Check the Supabase URL/key and that <code>schema.sql</code> has been run.</div>`;
    return;
  }
  if (!loaded) { app.innerHTML = `<div class="empty">Loading…</div>`; return; }

  app.innerHTML = view === 'detail' && selectedId ? renderDetail(selectedId) : renderList();
  attachHandlers();
}

let nationalOpen = false;
function nationalPanel() {
  const s = NATIONAL_STATS;
  const attemptChips = s.passByAttempt.map(([label, pct]) => `<span class="tag">${label} attempt: ${pct}%</span>`).join('');
  const waitRows = s.regionalWaitWeeks.map(([name, wk]) => `<tr><td>${esc(name)}</td><td class="num">${wk}w</td></tr>`).join('');
  return `
    <div class="card" id="nationalCard">
      <div class="card-row" style="cursor:pointer" id="nationalToggle">
        <div class="centre-name">🇬🇧 National picture (${esc(s.period)})</div>
        <span class="muted">${nationalOpen ? 'Hide ▲' : 'Show ▼'}</span>
      </div>
      ${nationalOpen ? `
        <div class="stat-grid" style="margin-top:12px">
          <div class="stat-box"><div class="num">${s.overallPassRate}%</div><div class="lbl">Overall pass rate</div></div>
          <div class="stat-box"><div class="num">${s.firstAttemptPassRate}%</div><div class="lbl">First-time pass rate</div></div>
          <div class="stat-box"><div class="num">${s.zeroFaultPassShare}%</div><div class="lbl">Passes with zero faults</div></div>
          <div class="stat-box"><div class="num">${s.theoryPassRate}%</div><div class="lbl">Theory test pass rate</div></div>
        </div>
        <p class="muted" style="margin:14px 0 6px">Pass rate by attempt number</p>
        <div class="tags">${attemptChips}</div>
        <p class="muted" style="margin:14px 0 6px">Median wait for a test, by region (${esc(s.waitTimesAsOf)})</p>
        <table style="width:100%;font-size:.85rem"><tbody>${waitRows}</tbody></table>
        <p class="note">These are national/regional DVSA figures, not specific to any one test centre — for a specific centre, use the list below.</p>
      ` : ''}
    </div>
  `;
}

function renderList() {
  const regions = Array.from(new Set(centres.map(c => c.region).filter(Boolean))).sort();
  const q = search.trim().toLowerCase();
  let list = centres.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || c.town.toLowerCase().includes(q)) &&
    (!regionFilter || c.region === regionFilter)
  );
  list = list.slice().sort((a, b) => {
    if (sortBy === 'name_asc') return a.name.localeCompare(b.name);
    if (sortBy === 'first_time_desc') {
      const fa = firstTimePassRate(a.id), fb = firstTimePassRate(b.id);
      if (fa && fb) return fb.pct - fa.pct;
      if (fa) return -1; if (fb) return 1;
      return a.name.localeCompare(b.name);
    }
    const ra = effectivePassRate(a.id), rb = effectivePassRate(b.id);
    if (ra && rb) return sortBy === 'pass_asc' ? ra.pct - rb.pct : rb.pct - ra.pct;
    if (ra) return -1; if (rb) return 1;
    return a.name.localeCompare(b.name);
  });

  const cards = list.map(c => {
    const r = effectivePassRate(c.id);
    const sum = reviewSummary(c.id);
    const badge = r ? `${r.pct}% pass${r.isAgeSpecific ? ' (age ' + ageFilter + ')' : ''}` : 'No data yet';
    return `<div class="card" data-id="${c.id}">
      <div class="card-row">
        <div>
          <div class="centre-name">${esc(c.name)}</div>
          <div class="centre-sub">${esc(c.town)}${c.county ? ', ' + esc(c.county) : ''}${sum ? ' · ' + sum.count + ' review' + (sum.count === 1 ? '' : 's') : ''}</div>
        </div>
        <span class="pill ${rateClass(r ? r.pct : null)}">${badge}</span>
      </div>
    </div>`;
  }).join('') || `<div class="empty">No test centres match that search.</div>`;

  return `
    ${nationalPanel()}
    <div class="searchbar">
      <input type="text" id="search" placeholder="Search by centre or town…" value="${esc(search)}">
    </div>
    <div class="searchbar">
      <select id="sort">
        <option value="pass_desc" ${sortBy === 'pass_desc' ? 'selected' : ''}>Pass rate: high to low</option>
        <option value="pass_asc" ${sortBy === 'pass_asc' ? 'selected' : ''}>Pass rate: low to high</option>
        <option value="first_time_desc" ${sortBy === 'first_time_desc' ? 'selected' : ''}>First-time pass rate</option>
        <option value="name_asc" ${sortBy === 'name_asc' ? 'selected' : ''}>Name A–Z</option>
      </select>
      <select id="age">
        <option value="">All ages</option>
        ${[17,18,19,20,21,22,23,24,25].map(a => `<option value="${a}" ${String(a) === ageFilter ? 'selected' : ''}>Age ${a}</option>`).join('')}
      </select>
      ${regions.length ? `<select id="region">
        <option value="">All regions</option>
        ${regions.map(r => `<option value="${esc(r)}" ${r === regionFilter ? 'selected' : ''}>${esc(r)}</option>`).join('')}
      </select>` : ''}
    </div>
    ${cards}
    <p class="note">Pass rates: DVSA official statistics (DRT122A/C/D/E), Open Government Licence v3.0. Reviews are submitted anonymously by candidates and instructors, and are moderated before publishing.</p>
  `;
}

function ageBlock(centreId) {
  const rows = ageRates[centreId];
  if (!rows) return '';
  const chips = [17,18,19,20,21,22,23,24,25]
    .map(age => ({ age, r: agePassRate(centreId, age) }))
    .filter(x => x.r)
    .map(x => `<span class="tag">Age ${x.age}: ${x.r.pct}% <span class="muted">(${x.r.tests.toLocaleString()} tests)</span></span>`)
    .join('');
  if (!chips) return '';
  return `
    <div class="section">
      <h3>Pass rate by age (17–25)</h3>
      <div class="tags">${chips}</div>
      <p class="note">DVSA breaks this out for younger candidates only; older age bands aren't published per centre.</p>
    </div>
  `;
}

function renderDetail(id) {
  const c = centres.find(x => x.id === id);
  if (!c) { view = 'list'; return renderList(); }
  const rates = passRates[id] || [];
  const sum = reviewSummary(id);
  const list = (reviews[id] || []);

  const statBoxes = rates.length
    ? rates.map(r => {
        const boxes = [];
        if (r.tests_conducted) {
          const pct = Math.round((r.tests_passed / r.tests_conducted) * 1000) / 10;
          boxes.push(`<div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Overall pass rate<br>${esc(r.period_label)} · ${r.tests_conducted.toLocaleString()} tests</div></div>`);
        }
        if (r.first_attempt_tests) {
          const fpct = Math.round((r.first_attempt_passes / r.first_attempt_tests) * 1000) / 10;
          boxes.push(`<div class="stat-box"><div class="num">${fpct}%</div><div class="lbl">First-time pass rate<br>${esc(r.period_label)} · ${r.first_attempt_tests.toLocaleString()} first tests</div></div>`);
        }
        if (r.automatic_tests) {
          const apct = Math.round((r.automatic_passes / r.automatic_tests) * 1000) / 10;
          boxes.push(`<div class="stat-box"><div class="num">${apct}%</div><div class="lbl">Automatic pass rate<br>${esc(r.period_label)} · ${r.automatic_tests.toLocaleString()} tests</div></div>`);
        }
        return boxes.join('');
      }).join('')
    : `<div class="empty">No official pass-rate data imported for this centre yet.</div>`;

  const summaryBlock = sum ? `
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat-box"><div class="num">${sum.count}</div><div class="lbl">Reviews</div></div>
      <div class="stat-box"><div class="num">${sum.avg != null ? sum.avg + '★' : '—'}</div><div class="lbl">Avg rating</div></div>
      <div class="stat-box"><div class="num">${sum.passes}/${sum.passes + sum.fails || 1}</div><div class="lbl">Passed (of rated)</div></div>
    </div>
    ${sum.tags.length ? `<div class="tags">${sum.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '<p class="muted">Not enough reviews yet to spot common themes.</p>'}
  ` : `<p class="empty">No reviews yet — be the first to leave one below.</p>`;

  const reviewList = list.length ? list.map(r => `
    <div class="review">
      <div class="review-head">
        <span>${r.reviewer_role ? esc(r.reviewer_role) : 'Anonymous'}${r.outcome ? ' · ' + (r.outcome === 'pass' ? '✅ Passed' : '❌ Did not pass') : ''}</span>
        <span>${timeAgo(r.created_at)}</span>
      </div>
      ${r.rating ? `<div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>` : ''}
      ${r.comment ? `<div>${esc(r.comment)}</div>` : ''}
    </div>
  `).join('') : '';

  return `
    <a class="backlink" id="back">← All test centres</a>
    <h2>${esc(c.name)}</h2>
    <p class="muted">${esc(c.town)}${c.county ? ', ' + esc(c.county) : ''}${c.postcode ? ' · ' + esc(c.postcode) : ''}</p>

    <div class="section">
      <h3>Pass rate</h3>
      <div class="stat-grid">${statBoxes}</div>
    </div>

    ${ageBlock(id)}

    <div class="section">
      <h3>What candidates say</h3>
      ${summaryBlock}
      ${reviewList}
    </div>

    <div class="section">
      <h3>Leave an anonymous review</h3>
      <form id="reviewForm">
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
        <label>I am a...</label>
        <select name="role">
          <option value="pupil">Pupil / learner</option>
          <option value="instructor">Driving instructor</option>
        </select>
        <div class="row2">
          <div>
            <label>Test outcome</label>
            <select name="outcome">
              <option value="">Prefer not to say</option>
              <option value="pass">Passed</option>
              <option value="fail">Did not pass</option>
            </select>
          </div>
          <div>
            <label>Rating</label>
            <select name="rating">
              <option value="">No rating</option>
              <option value="5">★★★★★</option>
              <option value="4">★★★★</option>
              <option value="3">★★★</option>
              <option value="2">★★</option>
              <option value="1">★</option>
            </select>
          </div>
        </div>
        <label>Comments (no names, please — this is anonymous)</label>
        <textarea name="comment" maxlength="1000" placeholder="e.g. Quiet test routes, plenty of roundabout practice, examiner was friendly and put me at ease."></textarea>
        <button class="primary" type="submit">Submit review</button>
        <p class="note">Reviews are checked before they appear publicly. Please don't include anyone's name — the point of this page is to describe the centre and the experience, not to identify an individual examiner.</p>
      </form>
    </div>
  `;
}

/* ------------------------------------------------------------
   Events
   ------------------------------------------------------------ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function attachHandlers() {
  document.querySelectorAll('.card[data-id]').forEach(el => el.addEventListener('click', () => {
    selectedId = el.dataset.id; view = 'detail'; render(); window.scrollTo(0, 0);
  }));
  const natToggle = document.getElementById('nationalToggle');
  if (natToggle) natToggle.addEventListener('click', () => { nationalOpen = !nationalOpen; render(); });
  const back = document.getElementById('back');
  if (back) back.addEventListener('click', () => { view = 'list'; render(); window.scrollTo(0, 0); });

  const s = document.getElementById('search');
  if (s) s.addEventListener('input', e => { search = e.target.value; render(); document.getElementById('search').focus(); document.getElementById('search').setSelectionRange(search.length, search.length); });
  const rg = document.getElementById('region');
  if (rg) rg.addEventListener('change', e => { regionFilter = e.target.value; render(); });
  const ageSel = document.getElementById('age');
  if (ageSel) ageSel.addEventListener('change', e => { ageFilter = e.target.value; render(); });
  const sortSel = document.getElementById('sort');
  if (sortSel) sortSel.addEventListener('change', e => { sortBy = e.target.value; render(); });

  const form = document.getElementById('reviewForm');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(form);
    if (fd.get('website')) return; // honeypot tripped — silently drop
    const comment = (fd.get('comment') || '').trim();
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      await sbInsert('reviews', {
        centre_id: selectedId,
        rating: fd.get('rating') ? Number(fd.get('rating')) : null,
        outcome: fd.get('outcome') || null,
        reviewer_role: fd.get('role') || null,
        comment: comment || null,
        is_approved: false,
      });
      form.reset();
      showToast('Thanks — your review will appear once it’s checked.');
    } catch (err) {
      console.error(err);
      showToast('Something went wrong — please try again.');
    }
    btn.disabled = false; btn.textContent = 'Submit review';
  });
}

loadAll();
</script>
</body>
</html>
